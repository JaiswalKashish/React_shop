<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>shop.contact</title>
    <link rel="stylesheet" href="stylesheet.css">
</head>
<body class="contact-page">
    <div class="nav">
        <a href="shop.html">Home</a>
        <a href="menu.html">Menu</a>
        <a href="contact.html" class="active">Contact</a>
        <a href="feedback.html">Feedback</a>
    </div>

    <!-- Contact Section -->
    <section class="contact">
        <h1>Contact Us 📞</h1>
        <p>We’d love to hear from you!</p>

        <div class="contact-container">

            <!-- Contact Info -->
            <div class="contact-info">
                <h3>Get in Touch</h3>
                <p><strong>📍 Address:</strong> Street Food Corner, Main Road, Chennai</p>
                <p><strong>📞 Phone:</strong> +91 9XXXXXXXXX</p>
                <p><strong>📧 Email:</strong> streetfood@gmail.com</p>
                <p><strong>🕒 Timing:</strong> Mon – Sun | 10 AM – 10 PM</p>
            </div>

            <!-- Contact Form -->
            <div class="contact-form">
                <h3>Send Us a Message</h3>
                <form>
                    <input type="text" placeholder="Your Name" required>
                    <input type="email" placeholder="Your Email" required>
                    <textarea placeholder="Your Message" required></textarea>
                    <button type="submit">Send Message</button>
                </form>
            </div>

        </div>
    </section>
    
</body>
</html>
